name: Bug Report
description: Create a report to help us improve PALASH-Vaani
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe the bug with as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating Platform
      options:
        - Android Tablet (2GB RAM)
        - Android Device (Other)
        - Web (Chrome/Edge)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide reproduction steps.
      placeholder: |
        1. Go to '...'
        2. Tap on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
